name: beyond-words
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pytorch
  - torchaudio
  - pytorch-cuda=11.8        # 1660 Ti supports CUDA 11.8 fine; adjust if your driver needs another
  - pip:
      - transformers>=4.40
      - datasets
      - librosa
      - soundfile
      - scikit-learn
      - pandas
      - numpy
      - tqdm
      - matplotlib
      - seaborn
      - audiomentations      # for Phase 3 augmentation
